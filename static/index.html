<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aoi</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0f1a; font-family: sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #canvas-wrap { flex:1; position:relative; min-height:0; }
  #live2d-canvas { width:100%; height:100%; display:block; }
  #status { position:absolute; top:8px; left:8px; color:#8be9fd; font-size:12px; opacity:0.7; }
  #chat-box {
    background:#1a1a2e; padding:10px; display:flex; gap:8px;
    border-top:1px solid #333; flex-shrink:0;
  }
  #log {
    background:#1a1a2e; color:#eee; font-size:13px;
    max-height:90px; overflow-y:auto; padding:6px 10px;
    border-top:1px solid #333;
  }
  #log div { margin:2px 0; }
  #log .me { color:#8be9fd; }
  #log .aoi { color:#ff9ecb; }
  #msg {
    flex:1; padding:10px; border-radius:8px; border:1px solid #444;
    background:#0f0f1a; color:#fff; font-size:14px;
  }
  #send {
    padding:10px 18px; border-radius:8px; border:none;
    background:#ff79c6; color:#fff; font-weight:bold; font-size:14px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <canvas id="live2d-canvas"></canvas>
    <div id="status">Connecting...</div>
  </div>
  <div id="log"></div>
  <div id="chat-box">
    <input id="msg" type="text" placeholder="Ketik pesan ke Aoi..." autocomplete="off">
    <button id="send">Kirim</button>
  </div>
</div>

<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
const MODEL_URL = "/static/model/qingyuan/qingyuan.model3.json";

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const msgEl = document.getElementById("msg");
const sendBtn = document.getElementById("send");

let model = null;
let app = null;

// ------------------------------------------------------------
// PIXI + Live2D setup
// ------------------------------------------------------------
async function initLive2D() {
  app = new PIXI.Application({
    view: document.getElementById("live2d-canvas"),
    resizeTo: document.getElementById("canvas-wrap"),
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
    backgroundAlpha: 0,
    autoStart: true,
  });

  // Pastikan Cubism 4 Core SDK sudah ter-load sebelum load model .moc3
  if (typeof window.Live2DCubismCore === "undefined") {
    statusEl.textContent = "⚠️ Cubism Core SDK gagal load (cek koneksi/adblock ke cubism.live2d.com)";
    console.error("Live2DCubismCore tidak terdefinisi — script CDN gagal load.");
    return;
  }

  try {
    model = await PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false });
    app.stage.addChild(model);

    // ------------------------------------------------------------
    // Posisi & skala — load dari localStorage kalau ada (persist walau reload)
    // ------------------------------------------------------------
    const STORAGE_KEY = "aoi_avatar_transform_v2";
    const baseScale = Math.min(app.screen.width / model.width, app.screen.height / model.height) * 0.9;

    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}

    if (saved && typeof saved.x === "number") {
      model.scale.set(saved.scale);
      model.x = saved.x;
      model.y = saved.y;
    } else {
      model.scale.set(baseScale);
      model.x = (app.screen.width - model.width * baseScale) / 2;
      model.y = (app.screen.height - model.height * baseScale) / 2;
    }

    const saveTransform = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          x: model.x, y: model.y, scale: model.scale.x
        }));
      } catch (e) {}
    };

    const canvasWrap = document.getElementById("canvas-wrap");

    // ------------------------------------------------------------
    // Fix: PIXI `resizeTo` cuma dengerin event resize WINDOW, bukan
    // perubahan ukuran elemen kontainernya sendiri. Jadi kalau
    // #canvas-wrap mengecil/membesar gara-gara layout lain berubah
    // (misal #log keisi pesan, chat-box muncul, dsb) tanpa window
    // ikut resize, resolusi render PIXI jadi nggak sinkron sama
    // ukuran CSS-nya → avatar keliatan melebar/gepeng (stretched).
    // ResizeObserver di sini mantau #canvas-wrap langsung dan minta
    // PIXI resize ulang tiap kali ukurannya benar-benar berubah.
    // ------------------------------------------------------------
    const resizeObserver = new ResizeObserver(() => {
      app.resize();
    });
    resizeObserver.observe(canvasWrap);

    // ------------------------------------------------------------
    // Drag (geser X/Y) — 1 jari / mouse, presisi 1:1 ikut kursor
    // ------------------------------------------------------------
    let dragging = false;
    let dragStart = { x: 0, y: 0 };
    let modelStart = { x: 0, y: 0 };

    const startDrag = (x, y) => {
      dragging = true;
      dragStart = { x, y };
      modelStart = { x: model.x, y: model.y };
    };
    const moveDrag = (x, y) => {
      if (!dragging) return;
      model.x = modelStart.x + (x - dragStart.x);
      model.y = modelStart.y + (y - dragStart.y);
    };
    const endDrag = () => {
      if (dragging) saveTransform();
      dragging = false;
    };

    // Mouse
    canvasWrap.addEventListener("mousedown", (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener("mouseup", endDrag);

    // ------------------------------------------------------------
    // Zoom — scroll wheel (desktop) & pinch 2 jari (mobile)
    //   wheel up / pinch keluar = zoom in, sebaliknya zoom out
    // ------------------------------------------------------------
    const zoomBy = (factor, cx, cy) => {
      const oldScale = model.scale.x;
      let newScale = oldScale * factor;
      newScale = Math.min(Math.max(newScale, baseScale * 0.2), baseScale * 6);
      const ratio = newScale / oldScale;
      model.x = cx - (cx - model.x) * ratio;
      model.y = cy - (cy - model.y) * ratio;
      model.scale.set(newScale);
    };

    canvasWrap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = canvasWrap.getBoundingClientRect();
      zoomBy(e.deltaY < 0 ? 1.08 : 0.93, e.clientX - rect.left, e.clientY - rect.top);
      saveTransform();
    }, { passive: false });

    // ------------------------------------------------------------
    // Touch: 1 jari = geser XY, 2 jari = pinch zoom (tarik keluar = besar, ke dalam = kecil)
    // ------------------------------------------------------------
    let lastPinchDist = null;

    canvasWrap.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
      } else if (e.touches.length === 2) {
        dragging = false;
        const [a, b] = e.touches;
        lastPinchDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      }
    }, { passive: true });

    canvasWrap.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) {
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      } else if (e.touches.length === 2) {
        const [a, b] = e.touches;
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (lastPinchDist != null) {
          const rect = canvasWrap.getBoundingClientRect();
          const cx = (a.clientX + b.clientX) / 2 - rect.left;
          const cy = (a.clientY + b.clientY) / 2 - rect.top;
          zoomBy(dist / lastPinchDist, cx, cy);
        }
        lastPinchDist = dist;
      }
    }, { passive: true });

    canvasWrap.addEventListener("touchend", (e) => {
      if (e.touches.length === 0) {
        endDrag();
        lastPinchDist = null;
        saveTransform();
      } else if (e.touches.length === 1) {
        // dari 2 jari -> 1 jari: mulai drag baru biar presisi
        lastPinchDist = null;
        saveTransform();
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    // ------------------------------------------------------------
    // Kepala ikut kursor/jari — ditulis lewat setParam() sendiri
    // (BUKAN model.focus() bawaan, supaya tidak rebutan tiap frame
    // dengan param gesture dari AI lewat /face websocket).
    // Lalu auto-reset HALUS ke posisi netral (default asli model)
    // setelah idle beberapa detik — seperti VTube Studio.
    // ------------------------------------------------------------
    const HEAD_IDLE_MS   = 1500; // berapa lama diam sebelum kepala mulai reset
    const HEAD_MAX_ANGLE = 30;   // derajat maksimum saat tracking kursor (ParamAngleX/Y)
    const HEAD_MAX_BODY  = 10;   // derajat maksimum body follow (BodyAngleX/Y)
    const FOLLOW_LERP    = 0.12; // kecepatan mengikuti kursor (0..1, makin besar makin cepat)
    const RESET_LERP     = 0.08; // kecepatan reset ke netral (0..1)

    let lastPointerMove = Date.now();
    let cursorActive = false;
    // posisi kursor dinormalisasi -1..1 relatif tengah canvas
    let targetNX = 0, targetNY = 0;
    // nilai param "head" saat ini (dikontrol loop di bawah, terpisah dari gesture AI)
    let headX = 0, headY = 0, bodyX = 0, bodyY = 0;

    const onPointerActivity = (x, y) => {
      lastPointerMove = Date.now();
      cursorActive = true;
      const rect = canvasWrap.getBoundingClientRect();
      const nx = ((x - rect.left) / rect.width) * 2 - 1;   // -1..1
      const ny = ((y - rect.top) / rect.height) * 2 - 1;   // -1..1
      targetNX = Math.min(Math.max(nx, -1), 1);
      targetNY = Math.min(Math.max(ny, -1), 1);
    };

    canvasWrap.addEventListener("mousemove", (e) => onPointerActivity(e.clientX, e.clientY));
    canvasWrap.addEventListener("mouseleave", () => { cursorActive = false; });
    canvasWrap.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) onPointerActivity(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    function setHeadParam(id, value) {
      // id sudah berupa Cubism param ID asli (bukan lewat BACKEND_RANGE),
      // jadi tulis langsung ke core, clamp ke rentang asli model.
      if (!model) return;
      const info = paramInfo[id];
      if (!info) return;
      const v = Math.min(Math.max(value, info.min), info.max);
      try {
        const core = model.internalModel.coreModel;
        if (core.setParameterValueById) core.setParameterValueById(id, v);
        else if (core.setParamFloat) core.setParamFloat(id, v);
      } catch (e) {}
    }

    // Loop animasi head-follow / idle-reset — jalan terus tiap frame via PIXI ticker
    // Final value = DEFAULT asli model + cursor-follow + offset gesture dari AI
    app.ticker.add(() => {
      if (!model || !paramInfo.ParamAngleX) return;

      const idle = Date.now() - lastPointerMove > HEAD_IDLE_MS;
      let goalNX = targetNX, goalNY = targetNY;
      let lerp = FOLLOW_LERP;

      if (idle || !cursorActive) {
        goalNX = 0;
        goalNY = 0;
        lerp = RESET_LERP;
        if (idle) { targetNX = 0; targetNY = 0; }
      }

      const goalHeadX = goalNX * HEAD_MAX_ANGLE;
      const goalHeadY = -goalNY * HEAD_MAX_ANGLE; // kursor naik (Y kecil) -> kepala mendongak
      const goalBodyX = goalNX * HEAD_MAX_BODY;
      const goalBodyY = -goalNY * HEAD_MAX_BODY;

      headX += (goalHeadX - headX) * lerp;
      headY += (goalHeadY - headY) * lerp;
      bodyX += (goalBodyX - bodyX) * lerp;
      bodyY += (goalBodyY - bodyY) * lerp;

      const aX = paramInfo.ParamAngleX;
      const aY = paramInfo.ParamAngleY;
      setHeadParam("ParamAngleX", (aX.def || 0) + headX + aiAngleOffset.ParamAngleX);
      setHeadParam("ParamAngleY", (aY.def || 0) + headY + aiAngleOffset.ParamAngleY);

      if (paramInfo.ParamAngleZ) {
        const fz = paramInfo.ParamAngleZ;
        setHeadParam("ParamAngleZ", (fz.def || 0) + aiAngleOffset.ParamAngleZ);
      }
      if (paramInfo.BodyAngleX) {
        const bX = paramInfo.BodyAngleX;
        setHeadParam("BodyAngleX", (bX.def || 0) + bodyX);
      }
      if (paramInfo.BodyAngleY) {
        const bY = paramInfo.BodyAngleY;
        setHeadParam("BodyAngleY", (bY.def || 0) + bodyY);
      }
    });

    statusEl.textContent = "Model loaded";
    setTimeout(() => statusEl.style.opacity = "0", 2000);
    buildParamInfo();

    // ------------------------------------------------------------
    // Fix: default bawaan model ini matanya ketutup (nilai default
    // ParamEyeLOpen/ParamEyeROpen dari .moc3 mendekati 0). Paksa buka
    // mata begitu model selesai load, supaya wajah default normal
    // (mata kebuka), bukan merem. Ini cuma dijalankan sekali saat load
    // — gesture AI lewat /face (misal AI mau bikin merem/kedip) tetap
    // bisa override lewat setParam() seperti biasa sesudahnya.
    // ------------------------------------------------------------
    try {
      const core = model.internalModel.coreModel;
      const openEye = (id) => {
        const info = paramInfo[id];
        if (!info) return;
        const v = info.max; // fully open
        if (core.setParameterValueById) core.setParameterValueById(id, v);
        else if (core.setParamFloat) core.setParamFloat(id, v);
      };
      openEye("ParamEyeLOpen");
      openEye("ParamEyeROpen");
    } catch (e) {}
  } catch (e) {
    statusEl.textContent = "⚠️ Gagal load model: " + (e && e.message ? e.message : e);
    console.error("Live2D load error:", e);
  }
}

// ------------------------------------------------------------
// Param range map — dibaca langsung dari model (Cubism Core),
// supaya skala gerakan match VTube Studio (native range model),
// dan idle/reset balik ke DEFAULT VALUE asli model (bukan 0 paksa).
// ------------------------------------------------------------
let paramInfo = {}; // id -> { min, max, def }

function buildParamInfo() {
  if (!model) return;
  try {
    const core = model.internalModel.coreModel;
    const ids  = core.getParameterIds ? core.getParameterIds() : core._model.parameters.ids;
    const mins = core.getParameterMinimumValues ? core.getParameterMinimumValues() : core._model.parameters.minimumValues;
    const maxs = core.getParameterMaximumValues ? core.getParameterMaximumValues() : core._model.parameters.maximumValues;
    const defs = core.getParameterDefaultValues ? core.getParameterDefaultValues() : core._model.parameters.defaultValues;
    for (let i = 0; i < ids.length; i++) {
      paramInfo[ids[i]] = { min: mins[i], max: maxs[i], def: defs[i] };
    }
  } catch (e) {
    console.warn("Tidak bisa baca param info dari model:", e);
  }
}

// Mapping nama param -> rentang normalized yang dikirim backend (PARAM_RANGE di config.py)
const BACKEND_RANGE = {
  ParamMouthOpenY:  [0, 1],
  ParamMouthForm:   [-1, 1],
  LianHong:         [0, 1],   // CheekPuff — blush
  ShengQi:          [0, 1],   // FaceAngry
  ParamBrowLForm:   [-1, 1],  // Brows
  LiuLei:           [0, 1],   // Tears
  AXY:              [0, 1],   // HeartEyes
  BVS2:             [0, 1],   // EyeRoll
  ParamEyeLSmile:   [0, 1],   // EyeSmile
  KouShui:          [0, 1],   // Drool
  LianHei:          [0, 1],   // DarkAura
  BXS:              [0, 1],   // HeartHands
  BVS:              [0, 1],   // PeaceSign
  ParamEyeLOpen:    [0, 1],
  ParamEyeROpen:    [0, 1],
  ParamEyeBallX:    [-1, 1],
  ParamEyeBallY:    [-1, 1],
  TuShe:            [0, 1],   // TongueOut
  ParamAngleX:      [-30, 30],
  ParamAngleY:      [-30, 30],
  ParamAngleZ:      [-30, 30],
};

// Gain ekstra untuk param sudut kepala — AI biasanya kirim nilai "penuh" di sekitar
// 5-15 (dari skala ±30), tapi rentang asli model (ParamAngleX/Y, FacePositionZ)
// biasanya cuma sekitar ±10/±30 juga. Gain ini bikin gerakan terasa selevel VTube Studio
// (gestur ringan tetap kelihatan jelas), tanpa menembus batas asli model (di-clamp di bawah).
const ANGLE_GAIN = {
  ParamAngleX:   2.2,
  ParamAngleY:   2.2,
  ParamAngleZ:   3.5,
};

// Param sudut kepala yang dikontrol bersama oleh:
//  - cursor/touch follow (loop ticker di initLive2D)
//  - gesture dari AI (lewat /face websocket)
// Supaya tidak rebutan tiap frame, AI gesture disimpan sebagai OFFSET
// dan dijumlahkan ke base (default + cursor-follow) oleh ticker.
const HEAD_ANGLE_IDS = new Set(["ParamAngleX", "ParamAngleY", "ParamAngleZ"]);
const aiAngleOffset = { ParamAngleX: 0, ParamAngleY: 0, ParamAngleZ: 0 };

function setParam(id, rawValue) {
  if (!model) return;
  try {
    const core = model.internalModel.coreModel;
    let value = rawValue;

    const info = paramInfo[id];
    const back = BACKEND_RANGE[id];

    // Param sudut kepala: jangan tulis langsung ke core (akan rebutan dengan
    // cursor-follow ticker). Simpan sebagai offset, ticker yang menjumlahkan.
    if (HEAD_ANGLE_IDS.has(id) && info && back) {
      const [bMin, bMax] = back;
      const gain = ANGLE_GAIN[id] || 1;
      let offset = 0;
      if (rawValue >= 0) {
        const tt = (bMax === 0) ? 0 : (rawValue / bMax) * gain;
        offset = Math.min(tt, 1) * (info.max - info.def);
      } else {
        const tt = (bMin === 0) ? 0 : (rawValue / bMin) * gain;
        offset = Math.min(tt, 1) * (info.def - info.min) * -1;
      }
      aiAngleOffset[id] = offset;
      return;
    }

    if (info && back) {
      const [bMin, bMax] = back;

      if (bMin < 0) {
        // Param bipolar lain (bukan head-angle): 0 backend = DEFAULT asli model.
        if (rawValue >= 0) {
          const tt = (bMax === 0) ? 0 : rawValue / bMax;
          value = info.def + Math.min(tt, 1) * (info.max - info.def);
        } else {
          const tt = (bMin === 0) ? 0 : rawValue / bMin;
          value = info.def + Math.min(tt, 1) * (info.min - info.def);
        }
      } else {
        // Param unipolar (0..x, misal: expression toggle kayak ShengQi/LiuLei/AXY/dst,
        // atau TuShe buat lidah): 0 backend = posisi DEFAULT asli model, bMax backend =
        // titik ekstrem terjauh dari default. Dicek info.max vs info.min biar tetap benar
        // walau suatu saat default-nya bukan di titik minimum.
        const t = Math.min(Math.max(rawValue / bMax, 0), 1);
        const target = (info.max !== info.def) ? info.max : info.min;
        value = info.def + t * (target - info.def);
      }

      // Hard clamp ke rentang asli model (jangan sampai tembus)
      value = Math.min(Math.max(value, info.min), info.max);
    }

    if (core.setParameterValueById) {
      core.setParameterValueById(id, value);
    } else if (core.setParamFloat) {
      core.setParamFloat(id, value);
    }
  } catch (e) { /* param mungkin tidak ada di model ini */ }
}

initLive2D();

// ------------------------------------------------------------
// WebSocket /face — terima param avatar
// ------------------------------------------------------------
function connectFace() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/face`);

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "params") {
      for (const [id, value] of Object.entries(msg.data)) {
        if (id && id !== "null") setParam(id, value);
      }
    }
  };
  ws.onclose = () => setTimeout(connectFace, 2000);
  ws.onerror = () => ws.close();
}
connectFace();

// ------------------------------------------------------------
// WebSocket /chat — kirim pesan, terima reply + audio
// ------------------------------------------------------------
let chatWs;
function connectChat() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  chatWs = new WebSocket(`${proto}://${location.host}/chat`);

  chatWs.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "reply") {
      addLog("aoi", "Aoi: " + msg.text);
      if (msg.audio_b64) {
        const audio = new Audio("data:audio/mpeg;base64," + msg.audio_b64);
        audio.play().catch(() => {});
      }
    } else if (msg.type === "error") {
      addLog("aoi", "⚠️ " + msg.message);
    }
  };
  chatWs.onclose = () => setTimeout(connectChat, 2000);
  chatWs.onerror = () => chatWs.close();
}
connectChat();

function addLog(cls, text) {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function sendMessage() {
  const text = msgEl.value.trim();
  if (!text || !chatWs || chatWs.readyState !== WebSocket.OPEN) return;
  addLog("me", "Kamu: " + text);
  chatWs.send(text);
  msgEl.value = "";
}

sendBtn.onclick = sendMessage;
msgEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
